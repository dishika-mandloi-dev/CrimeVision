<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrimeVision PRO — Register Examiner Clearance</title>
  <meta name="csrf-token" content="{{ csrf_token }}" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-canvas: #06080d;
      --bg-surface: #0e121c;
      --bg-card: rgba(14, 18, 28, 0.85);
      --bg-input: #0a0d14;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #00f0ff;
      --cyan-glow: #00f0ff;
      --cyan-subtle: rgba(0, 240, 255, 0.12);
      --emerald-glow: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --font-display: 'Plus Jakarta Sans', sans-serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-size: 32px 32px;
      background-image:
        linear-gradient(to right, rgba(0, 240, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.025) 1px, transparent 1px);
      pointer-events: none;
      z-index: 0;
    }

    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
    }

    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 240, 255, 0.22);
      border-radius: 16px;
      padding: 38px 34px;
      box-shadow: 0 24px 50px -12px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 240, 255, 0.08);
      position: relative;
    }

    .auth-card::before, .auth-card::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      pointer-events: none;
      border-color: var(--cyan-glow);
    }
    .auth-card::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid;
      border-left: 2px solid;
      border-top-left-radius: 4px;
    }
    .auth-card::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid;
      border-right: 2px solid;
      border-bottom-right-radius: 4px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      margin-bottom: 18px;
    }

    .brand-glyph {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: var(--cyan-glow);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--cyan-glow);
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .security-ribbon {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(0, 240, 255, 0.06);
      border: 1px solid rgba(0, 240, 255, 0.2);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--cyan-glow);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .security-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan-glow);
      box-shadow: 0 0 6px var(--cyan-glow);
    }

    .auth-title {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .auth-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 20px;
      line-height: 1.4;
      font-family: var(--font-sans);
    }

    .auth-alert--error {
      display: block;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
    }

    .auth-alert--success {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 480px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }

    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: var(--font-mono);
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.15);
      background: #0e121c;
    }

    .form-input::placeholder {
      color: #475569;
    }

    .form-hint {
      font-size: 0.7rem;
      color: var(--text-faint);
      margin-top: 4px;
      font-family: var(--font-mono);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--cyan-glow);
      color: #06080d;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-top: 14px;
      box-shadow: 0 4px 16px rgba(0, 240, 255, 0.3);
    }

    .btn-submit:hover:not(:disabled) {
      background: #38bdf8;
      box-shadow: 0 6px 24px rgba(0, 240, 255, 0.45);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--cyan-glow);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      
      <div class="auth-header">
        <div class="security-ribbon">
          <span class="security-dot"></span>
          <span>Clearance Request // Register</span>
        </div>

        <div>
          <a href="/" class="auth-brand">
            <span class="brand-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-dasharray="2 3" opacity="0.6"/>
                <polygon points="12 3 19 8 19 16 12 21 5 16 5 8" stroke="currentColor"/>
                <circle cx="12" cy="12" r="2" fill="currentColor"/>
              </svg>
            </span>
            <span class="brand-title">CrimeVision</span>
            <span class="brand-badge">PRO</span>
          </a>
        </div>

        <h1 class="auth-title">Register Examiner</h1>
        <p class="auth-subtitle">Initialize an isolated multimodal forensic workspace</p>
      </div>

      <div id="auth-alert" class="auth-alert"></div>

      <form id="signup-form">
        <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token }}" />

        <div class="form-group">
          <label for="display_name" class="form-label">Full Name / Examiner Call Sign</label>
          <input
            type="text"
            id="display_name"
            name="display_name"
            class="form-input"
            placeholder="e.g. Lead Analyst Sarah Connor"
            required
            autofocus
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              autocomplete="username"
              placeholder="s_connor"
              required
            />
            <div class="form-hint">3-30 alphanumeric</div>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Official Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              autocomplete="email"
              placeholder="sconnor@lab.gov"
              required
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password" class="form-label">Passcode</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              autocomplete="new-password"
              placeholder="••••••••••••"
              required
            />
            <div class="form-hint">Min 8 chars, 1 letter, 1 num</div>
          </div>

          <div class="form-group">
            <label for="password_confirm" class="form-label">Confirm Passcode</label>
            <input
              type="password"
              id="password_confirm"
              name="password_confirm"
              class="form-input"
              autocomplete="new-password"
              placeholder="••••••••••••"
              required
            />
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
          <span id="btn-text">Register Account</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already an accredited examiner? <a href="/login">Sign In</a></p>
        <p style="margin-top: 12px;"><a href="/" style="color: var(--text-faint); font-family: var(--font-mono); font-size: 0.74rem;">&larr; Return to Platform Overview</a></p>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const alertBox = document.getElementById('auth-alert');
    const submitBtn = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.className = 'auth-alert ' + (isSuccess ? 'auth-alert--success' : 'auth-alert--error');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'auth-alert';

      const displayName = document.getElementById('display_name').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password_confirm').value;
      const csrfToken = document.getElementById('csrf_token').value;

      if (password !== passwordConfirm) {
        showAlert('Passcodes do not match.');
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = 'Registering examiner...';

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken
          },
          body: JSON.stringify({
            display_name: displayName,
            username: username,
            email: email,
            password: password
          })
        });

        const data = await res.json();
        if (res.ok) {
          showAlert('Examiner credentials verified! Loading workspace...', true);
          setTimeout(() => {
            window.location.href = '/workspace';
          }, 450);
        } else {
          showAlert(data.error || 'Registration failed. Please check your information.');
          submitBtn.disabled = false;
          btnText.textContent = 'Register Account';
        }
      } catch (err) {
        showAlert('Network or connection error. Please try again.');
        submitBtn.disabled = false;
        btnText.textContent = 'Register Account';
      }
    });
  </script>
</body>
</html>
